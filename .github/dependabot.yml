version: 2
updates:
  # Dependency updates are proposed as reviewable pull requests; they never
  # modify release branches automatically.
  - package-ecosystem: swift
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    target-branch: main
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    target-branch: main
