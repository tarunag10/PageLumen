name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

permissions:
  contents: read

concurrency:
  group: pagelumen-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-tests:
    name: Swift tests
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run tests
        run: swift test -Xswiftc -gnone --parallel

  strict-diagnostics:
    name: Swift warnings as errors
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run strict diagnostics suite
        run: swift test -Xswiftc -gnone -Xswiftc -warnings-as-errors

  fixture-corpus:
    name: Fixture corpus contract
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate fixture manifests
        run: ./script/validate_fixture_corpus.sh

      - name: Run corpus regression tests
        run: swift test -Xswiftc -gnone --filter FixtureCorpusTests

  quality:
    name: Quality gates
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run local quality gates
        run: ./script/quality_gates.sh

  release-manifest:
    name: Release manifest validation
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release evidence contract
        run: ./script/validate_release_manifest.sh

  privacy-matrix:
    name: Privacy matrix validation
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate privacy matrix and manifest alignment
        run: ./script/validate_privacy_matrix.sh

  build:
    name: Xcode build
    runs-on: macos-latest
    needs: package-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build with xcodebuild
        run: >-
          xcodebuild -project PageLumen.xcodeproj -scheme PageLumen
          -configuration Debug -destination 'generic/platform=macOS' build
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
