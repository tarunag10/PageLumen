name: PageLumen
options:
  bundleIdPrefix: com.pagelumen
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    exactVersion: 0.9.20
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing.git
    from: 1.17.0
  Markdown:
    url: https://github.com/swiftlang/swift-markdown.git
    exactVersion: 0.8.0
targets:
  PageLumenCore:
    type: framework
    platform: macOS
    sources:
      - path: Sources/PageLumenCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pagelumen.PageLumenCore
        DEFINES_MODULE: true
    dependencies:
      - package: Markdown
    info:
      path: generated/PageLumenCore-Info.plist
      properties:
        CFBundleName: PageLumenCore
        CFBundlePackageType: FMWK
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
  PageLumen:
    type: application
    platform: macOS
    sources:
      - path: Sources/PageLumen
      - path: Assets.xcassets
    resources:
      - path: Config/PrivacyInfo.xcprivacy
    dependencies:
      - target: PageLumenCore
      - package: ZIPFoundation
      - target: PageLumenShareExtension
        embed: true
      - target: PageLumenQuickLookExtension
        embed: true
      - target: PageLumenFinderActionExtension
        embed: true
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: Config/PageLumen.entitlements
        ENABLE_HARDENED_RUNTIME: true
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.pagelumen.PageLumen
        PRODUCT_NAME: PageLumen
        INFOPLIST_KEY_LSMinimumSystemVersion: "14.0"
    info:
      path: generated/PageLumen-Info.plist
      properties:
        CFBundleName: PageLumen
        CFBundleDisplayName: PageLumen
        CFBundlePackageType: APPL
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "14.0"
        LSApplicationCategoryType: public.app-category.productivity
        NSPrincipalClass: NSApplication
        NSScreenCaptureUsageDescription: "PageLumen captures a selected screen region or window so it can be made readable and searchable on this Mac."
        NSHumanReadableCopyright: ""
        CFBundleDocumentTypes:
          - CFBundleTypeName: "PDF document"
            CFBundleTypeRole: "Editor"
            LSHandlerRank: "Owner"
            LSItemContentTypes:
              - "com.adobe.pdf"
          - CFBundleTypeName: "Image document"
            CFBundleTypeRole: "Editor"
            LSHandlerRank: "Owner"
            LSItemContentTypes:
              - "public.png"
              - "public.jpeg"
              - "public.tiff"
              - "public.heic"
  PageLumenCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/PageLumenCoreTests
    dependencies:
      - target: PageLumenCore
      - target: PageLumen
      - package: ZIPFoundation
      - package: SnapshotTesting
      - package: Markdown
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pagelumen.PageLumenCoreTests
    info:
      path: generated/PageLumenCoreTests-Info.plist
      properties:
        CFBundleName: PageLumenCoreTests
        CFBundlePackageType: BNDL
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
  PageLumenTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/PageLumenTests
    dependencies:
      - target: PageLumen
      - target: PageLumenCore
      - package: SnapshotTesting
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pagelumen.PageLumenTests
    info:
      path: generated/PageLumenTests-Info.plist
      properties:
        CFBundleName: PageLumenTests
        CFBundlePackageType: BNDL
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
  PageLumenUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: Tests/PageLumenUITests
    dependencies:
      - target: PageLumen
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pagelumen.PageLumenUITests
        TEST_TARGET_NAME: PageLumen
    info:
      path: generated/PageLumenUITests-Info.plist
      properties:
        CFBundleName: PageLumenUITests
        CFBundlePackageType: BNDL
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
  PageLumenShareExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: Sources/PageLumenShareExtension
    settings:
      base:
        APPLICATION_EXTENSION_API_ONLY: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.pagelumen.PageLumen.share
        PRODUCT_NAME: PageLumenShareExtension
        SKIP_INSTALL: YES
    info:
      path: generated/PageLumenShareExtension-Info.plist
      properties:
        CFBundleName: PageLumenShareExtension
        CFBundlePackageType: XPC!
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsFileWithMaxCount: 20
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).ShareViewController"
  PageLumenQuickLookExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: Sources/PageLumenQuickLookExtension
    settings:
      base:
        APPLICATION_EXTENSION_API_ONLY: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.pagelumen.PageLumen.quicklook
        PRODUCT_NAME: PageLumenQuickLookExtension
        SKIP_INSTALL: YES
    info:
      path: generated/PageLumenQuickLookExtension-Info.plist
      properties:
        CFBundleName: PageLumenQuickLookExtension
        CFBundlePackageType: XPC!
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.thumbnail
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).ThumbnailProvider"
  PageLumenFinderActionExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: Sources/PageLumenShareExtension
    settings:
      base:
        APPLICATION_EXTENSION_API_ONLY: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.pagelumen.PageLumen.finder-action
        PRODUCT_NAME: PageLumenFinderActionExtension
        SKIP_INSTALL: YES
    info:
      path: generated/PageLumenFinderActionExtension-Info.plist
      properties:
        CFBundleName: PageLumenFinderActionExtension
        CFBundlePackageType: XPC!
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsFileWithMaxCount: 20
          NSExtensionPointIdentifier: com.apple.ui-services
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).ShareViewController"
schemes:
  PageLumen:
    build:
      targets:
        PageLumen: all
        PageLumenCoreTests: [test]
        PageLumenTests: [test]
    run:
      config: Debug
      executable: PageLumen
    test:
      config: Debug
      targets:
        - PageLumenCoreTests
        - PageLumenTests
        - PageLumenUITests
        - PageLumenShareExtension
        - PageLumenQuickLookExtension
        - PageLumenFinderActionExtension
